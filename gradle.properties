# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# JDK utilisé pour LANCER Gradle (piège JAVA_HOME : le défaut système est un JDK 8).
# La toolchain compile en Java 25 (auto-provisionnée via foojay).
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

## Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.78

## Mod Properties
mod_id=pride
mod_name=Pride
mod_license=All Rights Reserved
mod_version=1.4.0
mod_group_id=com.natsu.pride
mod_authors=Natsu91
mod_description=A mod that replaces the whole PvP system, to revert it back to what it was in 1.8.9 / 1.7.10.
